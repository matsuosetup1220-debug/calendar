<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SET UP</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <script>
    window.onload = function() {
      // ホーム画面のアイコンから起動されたか判定
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      
      if (isStandalone) {
        // ホーム画面から開いた場合はカレンダーへ自動ワープ
        window.location.replace("https://script.google.com/macros/s/AKfycbwnyegZ8aa_FSN08lcpP2jw6jOMgmfg_Sn-CpsJBvjO8DXQ9YmwdUvMPBjJLzzkjp_8Zg/exec");
      } else {
        // 普通のブラウザで開いた場合は案内画面を表示して留まる
        document.getElementById("message").style.display = "block";
      }
    };
  </script>
</head>
<body style="background-color: #f5f5f5; text-align: center; padding-top: 50px; font-family: sans-serif; color: #333;">
  <div id="message" style="display: none; padding: 20px;">
    <h2 style="color: #1976d2;">システム設定画面</h2>
    <p>この画面のメニューから<br><b>「ホーム画面に追加」</b>を行ってください。</p>
    <p style="font-size: 13px; color: #666; margin-top:30px;">※追加されたアイコンをタップすると、<br>自動的にシステムが起動します。</p>
  </div>
</body>
</html>
