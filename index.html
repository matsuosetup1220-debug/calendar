<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SET UP</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    /* 余白を完全に無くし、画面いっぱいに広げる設定 */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /* カレンダーを映し出す窓の設定 */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
<!-- アプリ化の設計図を読み込む -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://drive.google.com/uc?export=view&id=1d6lCzfg5UaYee3YKa51Qlo3a0X8wXwM3">
  <meta name="theme-color" content="#1976d2">
</head>
<!-- サービスワーカーを起動する -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(registration) {
          console.log('ServiceWorker registration successful');
        }).catch(function(err) {
          console.log('ServiceWorker registration failed: ', err);
        });
    }
  </script>
  <body>
  <!-- ここに直接カレンダーを呼び出して埋め込みます -->
  <iframe src="https://script.google.com/macros/s/AKfycbwnyegZ8aa_FSN08lcpP2jw6jOMgmfg_Sn-CpsJBvjO8DXQ9YmwdUvMPBjJLzzkjp_8Zg/exec"></iframe>
</body>
</html>
