<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SET UP</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <script>
    window.onload = function() {
      var targetUrl = "https://script.google.com/macros/s/AKfycbwnyegZ8aa_FSN08lcpP2jw6jOMgmfg_Sn-CpsJBvjO8DXQ9YmwdUvMPBjJLzzkjp_8Zg/exec";
      
      // URLに「?app=1」という目印がついているか判定
      if (window.location.search.indexOf('app=1') !== -1) {
        // ホーム画面のアイコン（目印あり）から開いた場合は光の速さで自動ワープ
        window.location.replace(targetUrl);
      } else {
        // 普通のブラウザで開いた場合、URLの末尾にこっそり目印「?app=1」をつける
        window.history.replaceState(null, '', '?app=1');
        
        // 案内画面を表示
        document.getElementById("message").style.display = "block";
      }
    };
  </script>
</head>
<body style="background-color: #f5f5f5; text-align: center; padding-top: 50px; font-family: sans-serif; color: #333;">
  <div id="message" style="display: none; padding: 20px;">
    <h2 style="color: #1976d2;">システム設定画面</h2>
    <p>この画面のメニューから<br><b>「ホーム画面に追加」</b>を行ってください。</p>
    <p style="font-size: 13px; color: #666; margin-top:30px;">※追加されたアイコンをタップすると、<br>次回から全自動で起動します。</p>
  </div>
</body>
</html>
