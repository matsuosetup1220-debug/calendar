<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SET UP</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <!-- ★ここが本物のアプリとして認識させる設定です -->
  <link rel="manifest" href="manifest.json">
  
  <script>
    window.onload = function() {
      var targetUrl = "https://script.google.com/macros/s/AKfycbwnyegZ8aa_FSN08lcpP2jw6jOMgmfg_Sn-CpsJBvjO8DXQ9YmwdUvMPBjJLzzkjp_8Zg/exec";
      // ホーム画面のアイコンから開いた時だけワープする
      if (window.location.search.indexOf('app=1') !== -1 || window.matchMedia('(display-mode: standalone)').matches) {
        window.location.replace(targetUrl);
      } else {
        // 普通にブラウザで開いた時は絶対にワープさせない（設定画面に留まる）
        document.getElementById("message").style.display = "block";
      }
    };
  </script>
</head>
<body style="background-color: #f5f5f5; text-align: center; padding-top: 50px; font-family: sans-serif; color: #333;">
  <div id="message" style="display: none; padding: 20px;">
    <h2 style="color: #1976d2;">システム設定画面</h2>
    <p>この画面のメニューから<br><b>「ホーム画面に追加」</b>を行ってください。</p>
    <p style="font-size: 13px; color: #666; margin-top:30px;">※追加されたアイコンをタップすると、<br>次回から全自動で起動します。</p>
  </div>
</body>
</html>
